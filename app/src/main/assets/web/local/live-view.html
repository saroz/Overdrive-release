<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="app.live_view_title">Live View - OverDrive</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="../shared/app-icon-dark.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#DB4F1C">
    <script src="../shared/theme.js?v=12"></script>
    <script src="../shared/skeleton.js?v=4"></script>
    <script src="../shared/ph-icons.js?v=1"></script>
    <script src="../shared/app-shell.js?v=24"></script>
    <script src="../shared/pages/live-view.page.js?v=1"></script>
    <link rel="stylesheet" href="../shared/styles.css?v=39">
    <link rel="stylesheet" href="../shared/revamp.css?v=2">
    <link rel="stylesheet" href="../shared/leaflet.css" />
    <link rel="stylesheet" href="../shared/ui.css?v=1">
    <link rel="stylesheet" href="../shared/pages/live-view.css?v=2">
    <script src="../shared/leaflet.js"></script>
    <script src="../shared/vendor/jmuxer.min.js"></script>
    <script src="../shared/SotaPlayer.js?v=14"></script>
    <script src="../shared/Decoder.js"></script>
    <script src="../shared/YUVCanvas.js"></script>
    <script src="../shared/Player.js"></script>
</head>
<body class="ui-app live-view-page" data-page="live-view" data-ui-workspace>
    <div class="app-layout">
        <!-- Sidebar -->
        <!-- App shell sidebar (rendered by ../shared/app-shell.js?v=23) -->
        <div id="app-shell-mount"></div>
        <!-- Main Content -->
        <main class="main-content">
            <div class="ui-main">

            <div class="live-tabs-view" id="tabsView">
                <div class="tab-content">
                    <!-- Camera-first Live dashboard. In landscape the camera
                         stage keeps most of the canvas while the selector and
                         location preview share a utility rail on the right. -->
                    <div class="tab-panel active" id="panelCameras">
                        <div class="seamless-camera-view">
                            <div class="camera-stage">
                            <!-- Top Bar -->
                            <div class="camera-top-bar">
                                <div class="top-bar-left">
                                    <div class="connection-status" id="connectionStatus" role="status"
                                         aria-label="Select Camera"
                                         data-i18n-attr="aria-label:pip.select_camera">
                                        <span class="conn-dot"></span>
                                    </div>
                                </div>
                                <div class="top-bar-right">
                                    <!-- The <select> stays the source of truth for the
                                         quality value and its localized labels; the
                                         trigger and list mirror it because a native
                                         option popup can't be themed. -->
                                    <div class="quality-menu is-loading" id="qualityMenu" aria-busy="true">
                                        <select id="qualitySelector" class="quality-menu__native" onchange="BYD.stream.setQuality(this.value)">
                                            <option value="ULTRA_LOW"  data-i18n="stream.quality_ultra_low">Ultra Low (400k)</option>
                                            <option value="LOW"        data-i18n="stream.quality_low">Low (600k)</option>
                                            <option value="MEDIUM"     selected data-i18n="stream.quality_medium">Medium (1M)</option>
                                            <option value="HIGH"       data-i18n="stream.quality_high">High (1.5M)</option>
                                            <option value="ULTRA_HIGH" data-i18n="stream.quality_ultra_high">Ultra High (2.5M)</option>
                                            <option value="SMOOTH"     data-i18n="stream.quality_smooth">Smooth (3.5M, 25 fps)</option>
                                            <option value="MAX"        data-i18n="stream.quality_max">Max (5M, 30 fps)</option>
                                        </select>
                                        <button type="button" class="quality-menu__trigger" id="qualityMenuTrigger"
                                                aria-haspopup="listbox" aria-expanded="false"
                                                data-i18n-attr="aria-label:recording.video_quality_title"
                                                aria-label="Video Quality">
                                            <span class="quality-menu__value" id="qualityMenuValue">Medium (1M)</span>
                                            <svg class="quality-menu__chevron" viewBox="0 0 24 24" fill="none"
                                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                                <path d="m6 9 6 6 6-6"/>
                                            </svg>
                                        </button>
                                        <div class="quality-menu__list" id="qualityMenuList" role="listbox"></div>
                                    </div>
                                    <button class="top-bar-btn cabin-listen-btn"
                                            id="cabinListenButton"
                                            type="button"
                                            onclick="BYD.cabinListener.toggle()"
                                            aria-pressed="false"
                                            data-i18n-attr="title:liveview.listen_cabin;aria-label:liveview.listen_cabin"
                                            title="Listen to cabin"
                                            aria-label="Listen to cabin">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                                            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                                            <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                                        </svg>
                                    </button>
                                    <button type="button" class="top-bar-btn vehicle-actions-trigger" id="vehicleActionsTrigger"
                                            onclick="BYD.stream.toggleVehicleActions()" aria-haspopup="true"
                                            aria-controls="deterrentControls" aria-expanded="false"
                                            data-i18n-attr="title:liveview.actions;aria-label:liveview.actions"
                                            title="Actions" aria-label="Actions">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                            <path d="m6 9 6 6 6-6"/>
                                        </svg>
                                        <span data-i18n="liveview.actions">Actions</span>
                                    </button>
                                    <button type="button" class="top-bar-btn" id="liveRewindBtn"
                                            onclick="location.href='events.html?view=timeline&amp;t='+(new Date().getTime()-60000)"
                                            data-i18n-attr="title:tlview.rewind;aria-label:tlview.rewind"
                                            title="Rewind" aria-label="Rewind">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
                                        </svg>
                                    </button>
                                    <button class="top-bar-btn" onclick="BYD.stream.toggleFullscreen()" aria-label="Fullscreen" data-i18n-attr="aria-label:events.player_fullscreen;title:events.player_fullscreen" title="Fullscreen">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                            <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Video Display -->
                            <div class="video-display-area" id="videoDisplayArea">
                                <video id="hw_player" autoplay muted playsinline></video>
                                <div id="sw_container"></div>
                                <canvas id="sota_canvas"></canvas>
                                <div class="video-idle-state" id="videoIdleState">
                                    <div class="idle-icon">
                                        <svg class="idle-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/>
                                        </svg>
                                        <svg class="idle-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                                            <path d="M12 9v4"/><path d="M12 17h.01"/>
                                            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
                                        </svg>
                                        <span class="idle-spinner" aria-hidden="true"></span>
                                    </div>
                                    <span class="idle-text" data-i18n="stream.idle_hint">Tap a camera on the car below</span>
                                    <span class="idle-subtext" id="videoIdleSubtext"></span>
                                </div>
                                <div class="camera-label-overlay" id="cameraLabelOverlay" style="display:none;">
                                    <span id="currentCameraLabel" data-i18n="stream.front_camera">Front Camera</span>
                                </div>

                                <!-- Popover hidden until Actions is opened. Keep issue #425
                                     Lock/Unlock behavior and issue #118 deterrent handlers. -->
                                <div class="deterrent-controls" id="deterrentControls" style="display:none;"
                                     role="group" data-i18n-attr="aria-label:liveview.actions" aria-label="Actions">
                                    <!-- Door lock / unlock. Unlike horn + flash these have a local
                                         rail (SDK_FIRST, cloud as fallback), so the row is shown
                                         when either cloud or the local remote key is available. -->
                                    <div class="vehicle-lock-row" id="vehicleLockRow" style="display:none;">
                                        <button type="button" class="deterrent-btn deterrent-lock" id="vehicleLockBtn"
                                                onclick="BYD.stream.fireLiveAction('lock')"
                                                data-i18n-attr="title:dashboard.cmd_lock;aria-label:dashboard.cmd_lock"
                                                title="Lock" aria-label="Lock">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                            </svg>
                                            <span class="deterrent-label" data-i18n="dashboard.cmd_lock">Lock</span>
                                        </button>
                                        <button type="button" class="deterrent-btn deterrent-unlock" id="vehicleUnlockBtn"
                                                onclick="BYD.stream.fireLiveAction('unlock')"
                                                data-i18n-attr="title:dashboard.cmd_unlock;aria-label:dashboard.cmd_unlock"
                                                title="Unlock" aria-label="Unlock">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>
                                            </svg>
                                            <span class="deterrent-label" data-i18n="dashboard.cmd_unlock">Unlock</span>
                                        </button>
                                    </div>
                                    <button type="button" class="deterrent-btn deterrent-flash" id="deterrentFlashBtn" style="display:none;"
                                            onclick="BYD.stream.fireLiveAction('flash')"
                                            data-i18n-attr="title:liveview.deterrent_flash;aria-label:liveview.deterrent_flash"
                                            title="Flash" aria-label="Flash">
                                        <!-- Lucide lightbulb -->
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>
                                        </svg>
                                        <span class="deterrent-label" data-i18n="liveview.deterrent_flash">Flash</span>
                                    </button>
                                    <button type="button" class="deterrent-btn deterrent-horn" id="deterrentHornBtn" style="display:none;"
                                            onclick="BYD.stream.fireLiveAction('horn')"
                                            data-i18n-attr="title:liveview.deterrent_horn;aria-label:liveview.deterrent_horn"
                                            title="Horn" aria-label="Horn">
                                        <!-- Lucide megaphone -->
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
                                        </svg>
                                        <span class="deterrent-label" data-i18n="liveview.deterrent_horn">Horn</span>
                                    </button>
                                    <button type="button" class="deterrent-btn" id="vehiclePowerOnBtn" style="display:none;"
                                            onclick="BYD.stream.fireLiveAction('powerOn')">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
                                        <span class="deterrent-label" data-i18n="vehicle.power_on">Power on</span>
                                    </button>
                                    <button type="button" class="deterrent-btn" id="vehiclePowerOffBtn" style="display:none;"
                                            onclick="BYD.stream.fireLiveAction('powerOff')">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64A9 9 0 0 1 20.77 15"/><path d="M6.16 6.16a9 9 0 1 0 12.68 12.68"/><path d="M12 2v4"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                                        <span class="deterrent-label" data-i18n="vehicle.power_off">Power off</span>
                                    </button>
                                    <button type="button" class="deterrent-btn" id="vehicleTrunkOpenBtn"
                                            onclick="BYD.stream.fireLiveAction('trunkOpen')">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 21H2"/><path d="M10 4a2 2 0 0 1 2.36-1.968l5.41.992A1.5 1.5 0 0 1 19 4.5V21l-7.876.992A1 1 0 0 1 10 21z"/><path d="M10.268 3H7a2 2 0 0 0-2 2v16"/><path d="M14 12h.01"/><path d="M22 21h-3"/></svg>
                                        <span class="deterrent-label" data-i18n="dashboard.cmd_trunk_open">Open trunk</span>
                                    </button>
                                    <button type="button" class="deterrent-btn" id="vehicleTrunkCloseBtn"
                                            onclick="BYD.stream.fireLiveAction('trunkClose')">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16"/><path d="M2 21h20"/><path d="M9 12h.01"/></svg>
                                        <span class="deterrent-label" data-i18n="dashboard.cmd_trunk_close">Close trunk</span>
                                    </button>
                                </div>
                            </div>
                            </div>

                            <aside class="live-utility-rail" id="liveUtilityRail">
                            <section class="camera-selector-card" aria-label="Camera selector">
                            <!-- Camera selector — first card in the landscape utility rail. -->
                            <div class="selector-card-header">
                                <h2 data-i18n="liveview.cameras">Cameras</h2>
                            </div>
                            <div class="car-selector-bottom">
                                <div class="car-image-container">
                                    <img class="car-image-fallback"
                                         src="../shared/car-icon.webp"
                                         alt=""
                                         aria-hidden="true">
                                    <canvas id="liveCarCanvas" class="car-image" aria-hidden="true"></canvas>
                                    
                                    <!-- Camera Hotspots with Pulse Animation -->
                                    <div class="cam-hotspot" data-cam="1" onclick="BYD.stream.selectCamera(1)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_front">FRONT</span>
                                    </div>
                                    <!-- OEM Dashcam (data-cam=6). Hidden by default; the
                                         init script unhides it iff /api/settings/quality
                                         reports oemDashcam.oemDashcamCameraId >= 0. The
                                         "DVR" pill sits on the hood, slightly off-centre
                                         from the FRONT quadrant marker so users see the
                                         standalone dashcam sensor as distinct from the
                                         AVM front-quadrant stitch. -->
                                    <div class="cam-hotspot cam-dvr" data-cam="6" style="display:none;" onclick="BYD.stream.selectCamera(6)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_oem_dashcam">DVR</span>
                                    </div>
                                    <div class="cam-hotspot" data-cam="3" onclick="BYD.stream.selectCamera(3)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_rear">REAR</span>
                                    </div>
                                    <div class="cam-hotspot" data-cam="4" onclick="BYD.stream.selectCamera(4)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_left">LEFT</span>
                                    </div>
                                    <div class="cam-hotspot" data-cam="2" onclick="BYD.stream.selectCamera(2)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_right">RIGHT</span>
                                    </div>
                                    <div class="cam-hotspot cam-all" data-cam="0" onclick="BYD.stream.selectCamera(0)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_all">ALL</span>
                                    </div>
                                </div>
                            </div>
                            </section>

                            <section class="live-location-card" id="locationCard">
                                <div class="location-card-header">
                                    <div>
                                        <h2 data-i18n="dashboard.card_location">Vehicle location</h2>
                                        <div class="location-freshness is-sk">
                                            <span class="location-freshness-dot"></span>
                                            <span class="location-freshness-label">
                                                <span id="lastGpsUpdate">—</span>
                                            </span>
                                            <span class="sk sk-cover" data-sk-group="gpsFreshness"></span>
                                        </div>
                                    </div>
                                    <button type="button" class="location-close-button"
                                            onclick="BYD.liveLayout.setMapExpanded(false)"
                                            data-i18n-attr="aria-label:liveview.back_to_cameras"
                                            aria-label="Back to cameras">
                                        <svg viewBox="0 0 24 24" aria-hidden="true">
                                            <path fill="currentColor" d="M20 11v2H8l5.5 5.5-1.42 1.42L4.16 12l8.92-7.92L13.5 5.5 8 11h12z"/>
                                        </svg>
                                    </button>
                                </div>

                                <div class="location-map-frame">
                                    <div class="map-container" id="mapContainer"></div>
                                    <div class="map-overlay-actions">
                                        <button class="btn-map-float btn-my-location"
                                                onclick="BYD.map.showMyLocation()"
                                                data-i18n-attr="aria-label:liveview.my_location"
                                                aria-label="Show my location">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
                                            </svg>
                                        </button>
                                        <button class="btn-map-float btn-directions"
                                                onclick="BYD.map.openDirections()"
                                                data-i18n-attr="aria-label:liveview.directions"
                                                aria-label="Directions to vehicle">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
                                        </button>
                                    </div>
                                    <div class="location-distance-chip is-sk">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                                        </svg>
                                        <span class="location-distance-label">
                                            <span id="distanceToCar">—</span>
                                        </span>
                                        <span class="sk sk-cover" data-sk-group="gpsDistance"></span>
                                    </div>
                                </div>

                                <button type="button" class="location-expand-button"
                                        id="locationExpandButton"
                                        onclick="BYD.liveLayout.toggleMap()"
                                        aria-expanded="false">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                        <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                    </svg>
                                    <span id="locationExpandLabel" data-i18n="liveview.expand_map">Expand map</span>
                                </button>
                            </section>
                            </aside>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="ui-toast-stack"></div>


    <script src="../shared/auth.js"></script>
    <script src="../shared/pwa-init.js?v=index1"></script>
    <script src="../shared/core.js?v=27"></script>
    <script src="../shared/update-flow.js?v=4"></script>
    <script src="../shared/cabin-audio.js?v=2"></script>
    <script src="../shared/stream.js?v=index8"></script>
    <script src="../shared/map.js?v=9"></script>
    <script src="../shared/surveillance.js?v=survtoggle20"></script>
    <script src="../shared/pages/live-view-2.page.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="remote_dev.page_title">Remote Dev View</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <script src="../shared/theme.js?v=12"></script>
    <script src="../shared/ph-icons.js?v=1"></script>
    <script src="../shared/app-shell.js?v=20"></script>
    <link rel="stylesheet" href="../shared/styles.css?v=38">
    <link rel="stylesheet" href="../shared/revamp.css?v=2">
    <link rel="stylesheet" href="../shared/ui.css?v=1">
    <link rel="stylesheet" href="../shared/pages/remote-dev-view.css?v=1">
</head>
<body class="ui-app" data-page="remote-dev-view" data-ui-workspace>
<div class="app-layout">
    <div id="app-shell-mount"></div>
    <main class="main-content">
            <div class="ui-main">
        <div class="dev-view-page">
            <header class="dev-view-header" data-theme-dock>
                <h1 data-i18n="remote_dev.page_title">Remote Dev View</h1>
                <p data-i18n="remote_dev.subtitle">Control Overdrive's live app window beneath the ACC-off cover.</p>
            </header>

            <section id="startCard" class="dev-card session-strip">
                <div class="session-copy">
                    <strong data-i18n="remote_dev.live_session">Live control session</strong>
                    <small data-i18n="remote_dev.live_session_hint">Controls the real Overdrive app. Use only while parked.</small>
                </div>
                <div class="session-actions">
                    <button id="startButton" class="dev-button primary">Start session</button>
                </div>
                <div id="message" role="status" aria-live="polite"></div>
            </section>

            <div class="dev-view-grid">
                <section id="viewerCard" class="dev-card viewer-card" tabindex="0">
                    <div class="head-unit-bezel">
                        <div class="frame-shell">
                            <div class="fullscreen-toolbar">
                                <button id="fullscreenBackButton" class="dev-button compact" disabled data-i18n="remote_dev.back">Back</button>
                                <button id="fullscreenKeyboardButton" class="dev-button compact" disabled>Keyboard</button>
                                <button id="fullscreenScreenshotButton" class="dev-button compact" disabled>Screenshot</button>
                                <button id="fullscreenRefreshButton" class="dev-button compact" disabled data-i18n="remote_dev.refresh">Refresh</button>
                                <button id="fullscreenStopButton" class="dev-button compact danger" disabled data-i18n="remote_dev.end">End</button>
                                <button id="fullscreenExitButton" class="dev-button compact" data-i18n="remote_dev.exit_fullscreen">Exit fullscreen</button>
                            </div>
                            <div id="framePlaceholder" class="frame-placeholder">Start a session to view Overdrive.</div>
                            <canvas id="remoteFrame" width="960" height="540" role="img" aria-label="Live Overdrive app window" data-i18n-attr="aria-label:remote_dev.aria_live"></canvas>
                        </div>
                    </div>
                    <div class="viewer-footer">
                        <div class="frame-status">
                            <span><span id="liveDot" class="ui-dot"></span><span id="connectionState">Stopped</span></span>
                            <span id="frameDimensions">--</span>
                            <span id="pixelCopyState">Capture --</span>
                            <span id="activityState">Activity --</span>
                        </div>
                        <div class="button-row">
                            <button id="backButton" class="dev-button compact" disabled>Back</button>
                            <button id="fullscreenButton" class="dev-button compact" disabled>Fullscreen</button>
                            <button id="keyboardButton" class="dev-button compact" disabled>Keyboard</button>
                            <button id="screenshotButton" class="dev-button compact" disabled>Screenshot</button>
                            <button id="refreshButton" class="dev-button compact" disabled data-i18n="remote_dev.refresh">Refresh</button>
                            <button id="stopButton" class="dev-button compact danger" disabled data-i18n="remote_dev.end">End</button>
                        </div>
                    </div>
                    <textarea id="keyboardCapture" class="keyboard-capture" aria-label="Remote keyboard input" autocomplete="off" autocapitalize="sentences" spellcheck="false" disabled></textarea>
                </section>
            </div>
        </div>
        </div>
    </main>
</div>

<script src="../shared/auth.js"></script>
<script src="../shared/core.js?v=24"></script>
<script src="../shared/remote-dev-view.js?v=12"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        BYD.i18n.init().then(function () {
            BYD.core.init();
        });
    });
</script>
</body>
</html>

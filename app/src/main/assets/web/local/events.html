<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="app.events_title">Events - OverDrive</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="../shared/app-icon-dark.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#DB4F1C">
    <script src="../shared/on-actions.js?v=1"></script>
    <script src="../shared/theme.js?v=12"></script>
    <script src="../shared/ph-icons.js?v=1"></script>
    <script src="../shared/app-shell.js?v=24"></script>
    <script src="../shared/pages/events.page.js?v=1"></script>
    <link rel="stylesheet" href="../shared/styles.css?v=39">
    <link rel="stylesheet" href="../shared/revamp.css?v=2">
    <link rel="stylesheet" href="../shared/video-player.css?v=3">
    <link rel="stylesheet" href="../shared/timeline-view.css?v=1">
    <link rel="stylesheet" href="../shared/ui.css?v=1">
    <link rel="stylesheet" href="../shared/pages/events.css?v=1">
</head>
<body class="ui-app" data-page="events">
    <div class="app-layout">
        <!-- Sidebar -->
        <!-- App shell sidebar (rendered by ../shared/app-shell.js?v=23) -->
        <div id="app-shell-mount"></div>
        <!-- Main Content -->
        <main class="main-content">
            <div class="ui-main">
            <!-- Page title, named like the nav entry. theme.js docks the theme picker here. -->
            <header class="ui-page-head">
                <h1 data-i18n="nav.recordings">Recordings</h1>
            </header>
            <div class="events-container">
                <!-- Toolbar: date chip + type segments, then storage meter + Select at the end -->
                <div class="events-top-bar">
                    <div class="tlv-seg" id="tlvModeSwitch" role="group">
                        <button type="button" class="tlv-seg-btn" data-tlv-mode="list" aria-pressed="true" data-i18n="tlview.tabList">List</button>
                        <button type="button" class="tlv-seg-btn" data-tlv-mode="timeline" aria-pressed="false" data-i18n="tlview.tabTimeline">Timeline</button>
                    </div>
                    <button class="calendar-toggle" id="calendarToggle" data-on-click="BYD.events.toggleCalendar()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span id="calendarBtnText" data-i18n="events.select_date">Select Date</span>
                    </button>

                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all" data-on-click="BYD.events.setFilter('all')" data-i18n="events.all">All</button>
                        <button class="filter-tab" data-filter="sentry" data-on-click="BYD.events.setFilter('sentry')" data-i18n="events.badge_sentry">Surveillance</button>
                        <button class="filter-tab" data-filter="normal" data-on-click="BYD.events.setFilter('normal')" data-i18n="events.badge_normal">Normal</button>
                        <button class="filter-tab" data-filter="proximity" data-on-click="BYD.events.setFilter('proximity')" data-i18n="events.badge_proximity">Proximity</button>
                        <button class="filter-tab" data-filter="replay" data-on-click="BYD.events.setFilter('replay')" data-i18n="events.tab_replays">Replays</button>
                    </div>

                    <div class="toolbar-end">
                        <div class="storage-stats" id="storageStats">
                            <div class="ui-meter-labels">
                                <span class="storage-value" id="storageUsed">--</span>
                                <div class="storage-bar-mini">
                                    <div class="ui-meter-fill" id="storageFill" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="storage-breakdown">
                                <div class="storage-item">
                                    <span class="storage-dot normal"></span>
                                    <span id="normalCount">0</span>
                                </div>
                                <div class="storage-item">
                                    <span class="storage-dot sentry"></span>
                                    <span id="sentryCount">0</span>
                                </div>
                                <div class="storage-item">
                                    <span class="storage-dot proximity"></span>
                                    <span id="proximityCount">0</span>
                                </div>
                                <div class="storage-item">
                                    <span class="storage-dot replay"></span>
                                    <span id="replayCount">0</span>
                                </div>
                            </div>
                        </div>
                        <a class="ui-button" href="/factory-dvr.html" data-i18n="factory_dvr.title">Factory DVR</a>
                        <button class="select-mode-btn" id="selectModeBtn" data-on-click="BYD.events.toggleSelectMode()" title="Select multiple" data-i18n-attr="title:events.select_multiple">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 11 12 14 22 4"/>
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!--
                  v3 actor / severity / proximity chip rows. Lives OUTSIDE
                  .events-top-bar so the desktop horizontal flex layout for
                  calendar+type-tabs+storage stays uncluttered. Three labelled
                  rows below, each with its own "Any" to clear that dimension.
                -->
                <div class="ui-panel actor-filter-rows">
                    <div class="filter-tabs filter-tabs-row2" data-filter-row="class">
                        <span class="filter-row-label" data-i18n="events.filter_what">What:</span>
                        <button class="filter-chip active" data-class="" data-on-click="BYD.events.setActorFilter('class','')" data-i18n="events.actor_any">Any</button>
                        <button class="filter-chip" data-class="person"  data-on-click="BYD.events.setActorFilter('class','person')" data-i18n="events.actor_person">Person</button>
                        <button class="filter-chip" data-class="vehicle" data-on-click="BYD.events.setActorFilter('class','vehicle')" data-i18n="events.actor_vehicle">Vehicle</button>
                        <button class="filter-chip" data-class="bike"    data-on-click="BYD.events.setActorFilter('class','bike')" data-i18n="events.actor_bike">Bike</button>
                        <button class="filter-chip" data-class="animal"  data-on-click="BYD.events.setActorFilter('class','animal')" data-i18n="events.actor_animal">Animal</button>
                    </div>
                    <div class="filter-tabs filter-tabs-row2" data-filter-row="severity">
                        <span class="filter-row-label" data-i18n="events.filter_severity">Severity:</span>
                        <button class="filter-chip active" data-severity="" data-on-click="BYD.events.setActorFilter('severity','')" data-i18n="events.actor_any">Any</button>
                        <button class="filter-chip sev-notice"   data-severity="NOTICE"   data-on-click="BYD.events.setActorFilter('severity','NOTICE')" data-i18n="events.severity_notice">Notice</button>
                        <button class="filter-chip sev-alert"    data-severity="ALERT"    data-on-click="BYD.events.setActorFilter('severity','ALERT')" data-i18n="events.severity_alert">Alert</button>
                        <button class="filter-chip sev-critical" data-severity="CRITICAL" data-on-click="BYD.events.setActorFilter('severity','CRITICAL')" data-i18n="events.severity_critical">Critical</button>
                    </div>
                    <div class="filter-tabs filter-tabs-row2" data-filter-row="proximity">
                        <span class="filter-row-label" data-i18n="events.filter_distance">Distance:</span>
                        <button class="filter-chip active" data-proximity="" data-on-click="BYD.events.setActorFilter('proximity','')" data-i18n="events.actor_any">Any</button>
                        <button class="filter-chip" data-proximity="VERY_CLOSE" data-on-click="BYD.events.setActorFilter('proximity','VERY_CLOSE')" data-i18n="events.proximity_very_close">Very close</button>
                        <button class="filter-chip" data-proximity="CLOSE"      data-on-click="BYD.events.setActorFilter('proximity','CLOSE')" data-i18n="events.proximity_close">Close</button>
                        <button class="filter-chip" data-proximity="MID"        data-on-click="BYD.events.setActorFilter('proximity','MID')" data-i18n="events.proximity_mid">Mid</button>
                        <button class="filter-chip" data-proximity="FAR"        data-on-click="BYD.events.setActorFilter('proximity','FAR')" data-i18n="events.proximity_far">Far</button>
                    </div>
                    <!--
                      Storage chip row — narrow the library to one physical
                      volume. Clips already span internal + SD + USB in the
                      index; this filters by where each clip actually landed
                      (the per-clip storage badge shows the same tag). "Any"
                      is the default and shows every location.
                    -->
                    <div class="filter-tabs filter-tabs-row2" data-filter-row="storage">
                        <span class="filter-row-label" data-i18n="events.filter_storage">Storage:</span>
                        <button class="filter-chip active" data-storage="" data-on-click="BYD.events.setStorageFilter('')" data-i18n="events.actor_any">Any</button>
                        <button class="filter-chip storage-internal" data-storage="INTERNAL" data-on-click="BYD.events.setStorageFilter('INTERNAL')" data-i18n="events.storage_internal">Internal</button>
                        <button class="filter-chip storage-sd" data-storage="SD_CARD" data-on-click="BYD.events.setStorageFilter('SD_CARD')" data-i18n="events.storage_sd_card">SD card</button>
                        <button class="filter-chip storage-usb" data-storage="USB" data-on-click="BYD.events.setStorageFilter('USB')" data-i18n="events.storage_usb">USB</button>
                    </div>
                    <!--
                      Place chip row — dynamically populated from
                      `rec.place.short` of the currently loaded recordings
                      (descending count, alpha-tiebreak, capped at 8).
                      Always mounted now so the inline place-search input
                      is reachable from page load — even on a fresh user
                      with no resolved places yet, the search affordance
                      is visible. Data chips ("Any" + N labels) populate
                      progressively as the index lands.
                    -->
                    <div class="filter-tabs filter-tabs-row2" data-filter-row="place" id="placeFilterRow">
                        <span class="filter-row-label" data-i18n="events.filter_place">Place:</span>
                        <!--
                          Free-text place search — substring across short /
                          medium / displayName labels. Lives inline at the
                          head of the place row so the user sees one
                          coherent "Place" control rather than a separate
                          search bar competing for attention. Visibility is
                          coupled to the chip row — both appear once the
                          backend returns at least one indexed place; from
                          that moment the input remains visible regardless
                          of whether the active filter narrows the chip
                          set to zero.
                        -->
                        <label class="place-search" id="placeSearchWrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="search" id="placeSearchInput"
                                   autocomplete="off" autocorrect="off"
                                   autocapitalize="off" spellcheck="false"
                                   data-i18n-attr="placeholder:events.place_search_hint;aria-label:events.place_search_hint"
                                   placeholder="Search places…"
                                   aria-label="Search places" />
                            <button type="button" class="place-search-clear"
                                    id="placeSearchClear"
                                    data-i18n-attr="aria-label:common.close"
                                    aria-label="Clear">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </label>
                        <button class="filter-chip active" data-place="" data-on-click="BYD.events.setActorFilter('place','')" data-i18n="events.actor_any">Any</button>
                        <!-- Data chips injected by BYD.events.renderPlaceChips() -->
                        <span class="place-search-hits" id="placeSearchHits" aria-live="polite"></span>
                    </div>
                </div>
                
                <section id="tlvRoot" class="tlv-root" hidden></section>
                <!-- Recordings: summary line, clips grouped by day, pagination, selection bar -->
                <div class="recordings-panel">
                    <div class="recordings-header">
                        <span class="recordings-title" id="recordingsTitle" data-i18n="events.all_recordings">All Recordings</span>
                        <span class="recordings-count" id="recordingsCount" data-i18n="events.videos_count_initial">0 videos</span>
                    </div>
                    <div class="recordings-list" id="recordingsList">
                        <div class="loading">
                            <div class="ui-spinner"></div>
                        </div>
                    </div>
                    <div class="pagination" id="pagination" style="display: none;">
                        <button class="pagination-btn" id="prevPageBtn" data-on-click="BYD.events.prevPage()" disabled data-i18n="events.prev">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 18l-6-6 6-6"/>
                            </svg>
                            Prev
                        </button>
                        <span class="pagination-info" id="paginationInfo" data-i18n="events.page_initial">Page 1 of 1</span>
                        <button class="pagination-btn" id="nextPageBtn" data-on-click="BYD.events.nextPage()" disabled data-i18n="events.next">
                            Next
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18l6-6-6-6"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Multi-select toolbar: after the list so it can hold to the bottom of the screen -->
                    <div class="select-toolbar" id="selectToolbar" style="display:none;">
                        <span class="selected-count" id="selectedCount" data-i18n="events.selected_count_initial">0 selected</span>
                        <div class="select-actions">
                            <button class="select-action-btn" data-on-click="BYD.events.selectAll()" data-i18n="common.select_all">Select All</button>
                            <button class="select-action-btn" data-on-click="BYD.events.deselectAll()" data-i18n="events.deselect">Deselect</button>
                            <button class="select-action-btn cancel" data-on-click="BYD.events.exitSelectMode()" data-i18n="common.cancel">Cancel</button>
                            <button class="select-action-btn danger" data-on-click="BYD.events.batchDelete()" data-i18n="common.delete">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </main>
    </div>
    
    <script src="../shared/video-player.js?v=3"></script>
    <script src="../shared/lens-dewarp.js?v=3"></script>
    
    <!-- Calendar Popup -->
    <div class="calendar-popup" id="calendarPopup">
        <div class="calendar-panel">
            <div class="calendar-header">
                <span class="calendar-title" id="calendarTitle" data-i18n="events.calendar_title_initial">Calendar</span>
                <div class="calendar-nav">
                    <button data-on-click="BYD.events.prevMonth()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <button data-on-click="BYD.events.nextMonth()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar days will be rendered here -->
            </div>
            <button class="calendar-close" data-on-click="BYD.events.closeCalendar()" data-i18n="common.close">Close</button>
        </div>
    </div>

    <div id="toastContainer" class="ui-toast-stack"></div>

    <script src="../shared/auth.js"></script>
    <script src="../shared/pwa-init.js?v=index1"></script>
    <script src="../shared/core.js?v=27"></script>
    <script src="../shared/update-flow.js?v=4"></script>
    <script src="../shared/safekeep-badges.js?v=4"></script>
    <script src="../shared/events.js?v=revamp21"></script>
    <script src="../shared/pages/events-2.page.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="app.login_title">Login - Altitude 8848</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <script src="../shared/on-actions.js?v=1"></script>
    <script src="../shared/theme.js?v=13"></script>
    <link rel="stylesheet" href="../shared/design-tokens.css?v=3">
    <link rel="stylesheet" href="../shared/ui.css?v=4">
    <link rel="stylesheet" href="../shared/pages/login.css?v=2">
    <!-- Load i18n runtime so BYD.i18n.init() resolves. The login page has no
         sidebar/status polling so we don't need the rest of core.js, but
         loading it here keeps the dependency graph consistent. -->
    <script src="../shared/core.js?v=28"></script>
    <script src="../shared/ph-icons.js?v=1"></script>
</head>
<body class="ui-app" data-page="login" data-ui-workspace>
    <div class="login-container">
        <div class="login-card">
            <img class="login-logo" src="../shared/brand/altitude-8848.svg" alt="Altitude 8848">
            <h1 class="login-title" data-i18n="app.name">Altitude 8848</h1>
            <p class="login-subtitle" data-i18n="login.subtitle">Enter your device token to access</p>

            <div id="deviceInfo" class="device-info">
                <div class="device-info-label" data-i18n="login.device_id">Device ID</div>
                <!-- No data-i18n here: the device ID is written by JS. A
                     data-i18n binding would let the i18n hydrate() pass
                     overwrite the device ID with the localized "Loading..."
                     on every locale change. setInitialLoadingText() seeds
                     the localized placeholder once instead. -->
                <div class="device-info-value" id="deviceIdDisplay">Loading...</div>
            </div>

            <div id="statusMessage" class="status-message"></div>

            <div class="ui-field">
                <label class="ui-label" data-i18n="common.access_code">Access Code</label>
                <input type="text"
                       id="tokenInput"
                       class="form-input"
                       placeholder=""
                       autocomplete="off"
                       spellcheck="false"
                       maxlength="32"
                       style="text-align: center; font-size: 20px; letter-spacing: 0.2em;">
                <p class="ui-hint" data-i18n="login.find_hint">Find this in your Altitude 8848 app → Dashboard → Access Code</p>
                <p class="form-error" id="tokenError"></p>
            </div>

            <button class="ui-button ui-button-primary ui-button-block" id="loginBtn" data-on-click="login()">
                <span id="loginBtnText" data-i18n="login.login_btn">Login</span>
                <div class="ui-spinner" id="loginSpinner" style="display:none;"></div>
            </button>

            <div class="login-footer">
                <p data-i18n="login.privacy">Your data stays on your device.</p>
            </div>
        </div>
    </div>

    <script src="../shared/pages/login.page.js?v=1"></script>
</body>
</html>

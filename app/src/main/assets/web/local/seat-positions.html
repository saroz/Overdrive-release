<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="app.seat_positions_title">Seat Positions - OverDrive</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="../shared/app-icon-dark.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#DB4F1C">
    <script src="../shared/theme.js?v=12"></script>
    <script src="../shared/ph-icons.js?v=1"></script>
    <script src="../shared/app-shell.js?v=24"></script>
    <script src="../shared/skeleton.js?v=4"></script>
    <link rel="stylesheet" href="../shared/styles.css?v=39">
    <link rel="stylesheet" href="../shared/revamp.css?v=2">
    <link rel="stylesheet" href="../shared/seat-positions.css?v=9">
    <link rel="stylesheet" href="../shared/ui.css?v=1">
</head>
<body class="ui-app" data-page="seat-positions">
    <div class="app-layout">
        <div id="app-shell-mount"></div>
        <main class="main-content">
            <div class="ui-main">

            <!-- Hidden in the Android shell (the toolbar already names the page).
                 Kept for the standalone / tunnel session. -->
            <header class="ui-page-head">
                <h1 data-i18n="seatpos.page_title">Seat Positions</h1>
            </header>

            <div class="ui-page-body">

                <div class="ui-panel sp-now">
                    <div class="ui-panel-body sp-now-body">
                        <div class="sp-now-art" id="spCurrentGlyph" data-sk-real="seatCurrent"></div>
                        <div class="sk sp-sk-art" data-sk-group="seatCurrent"></div>
                        <div class="sp-now-main">
                            <div class="sp-now-eyebrow" data-i18n="seatpos.current">Current position</div>
                            <div class="sp-match" id="spCurrentMatch" data-sk-real="seatCurrent"></div>
                            <div id="spCurrentAxes" data-sk-real="seatCurrent"></div>
                            <div class="sp-sk-main" data-sk-group="seatCurrent">
                                <div class="sk sk-line sp-sk-match"></div>
                                <div class="sk sk-line sp-sk-axes"></div>
                            </div>
                        </div>
                        <div class="sp-now-actions">
                            <button class="ui-button ui-button-primary" id="spSaveNew">
                                <span data-i18n="seatpos.save_as_new">Save as new</span>
                            </button>
                        </div>
                    </div>
                    <!-- Priority order lives in renderGate(): unpowered motors first
                         (a write is accepted and does nothing), then gear-out-of-P,
                         then an unconfirmed axis map. -->
                    <div class="sp-status" id="spStatus" data-state="off">
                        <span class="sp-status-dot" aria-hidden="true"></span>
                        <span class="sp-status-text" id="spStatusText" data-i18n="seatpos.gate_acc_off">The car is off, so the seat motors have no power. Apply and save will do nothing until you turn it on.</span>
                    </div>
                    <div class="sp-batches" id="spBatches" style="display:none;">
                        <span class="sp-batch" id="spBatch1"><span class="led"></span>batch 1 � mirrors</span>
                        <span class="sp-batch" id="spBatch2"><span class="led"></span>batch 2 � seat</span>
                    </div>
                </div>

                <div id="spList" data-sk-real="seatList"></div>

                <div class="ui-panel sp-sk-list" data-sk-group="seatList">
                    <div class="ui-panel-body">
                        <div class="sk sk-line sp-sk-row"></div>
                        <div class="sk sk-line sp-sk-row"></div>
                        <div class="sk sk-line sp-sk-row"></div>
                    </div>
                </div>

            </div>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="ui-toast-stack"></div>

    <div class="ui-modal-backdrop" id="spScrim" style="display:none;">
        <div class="ui-dialog sp-dialog" role="dialog" aria-modal="true" aria-labelledby="spDialogTitle">
            <h3 id="spDialogTitle" class="sp-dialog-title"></h3>
            <p id="spDialogBody" class="sp-dialog-body"></p>
            <div id="spDialogHtml"></div>
            <input type="text" id="spDialogInput" class="input" maxlength="60">
            <div class="sp-dialog-actions">
                <button class="ui-button sp-dialog-cancel" id="spDialogCancel" data-i18n="common.cancel">Cancel</button>
                <button class="ui-button ui-button-primary" id="spDialogConfirm"></button>
            </div>
        </div>
    </div>

    <script src="../shared/auth.js"></script>
    <script src="../shared/pwa-init.js?v=index1"></script>
    <script src="../shared/core.js?v=27"></script>
    <script src="../shared/update-flow.js?v=3"></script>
    <script src="../shared/seat-positions.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            BYD.i18n.init().then(function () {
                BYD.core.init();
                SeatPositions.init();
            });
        });
    </script>
</body>
</html>
